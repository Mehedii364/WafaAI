name: Wafa AI Android Build & APK Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --continue || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Validate APK exists and size > 1MB
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Debug APK not found!"
            exit 1
          fi
          FILESIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "Found APK at $APK_PATH with size $FILESIZE bytes"
          if [ "$FILESIZE" -le 1048576 ]; then
            echo "Error: APK size ($FILESIZE bytes) is not greater than 1 MB!"
            exit 1
          fi
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD
          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk
          echo "Successfully validated and copied APK."

      - name: Build Android App Bundle (AAB)
        run: gradle :app:bundleRelease || gradle :app:bundleDebug || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wafa-ai-debug-apk
          path: .build-outputs/app-debug.apk
          retention-days: 14

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wafa-ai-app-bundle
          path: app/build/outputs/bundle/**/*.aab
          retention-days: 14
          if-no-files-found: ignore
